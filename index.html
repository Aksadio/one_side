    <script>
      // Prevent browser extensions (e.g., request interceptors) from crashing when
      // window.fetch is defined as a getter-only property by the host environment.
      (function () {
        try {
          var desc =
            Object.getOwnPropertyDescriptor(window, 'fetch') ||
            Object.getOwnPropertyDescriptor(Object.getPrototypeOf(window) || {}, 'fetch');
          if (desc && desc.get && !desc.set && desc.configurable !== false) {
            var currentFetch = window.fetch.bind(window);
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function () {
                return currentFetch;
              },
              set: function (nextFetch) {
                if (typeof nextFetch === 'function') {
                  currentFetch = nextFetch;
                }
              },
            });
          }
        } catch (_) {}

        window.addEventListener(
          'error',
          function (event) {
            var filename = event && event.filename ? String(event.filename) : '';
            var message = event && event.message ? String(event.message) : '';
            if (
              filename.indexOf('chrome-extension://') === 0 ||
              message.indexOf('Cannot set property fetch of #<Window>') !== -1
            ) {
              event.stopImmediatePropagation();
              event.preventDefault();
            }
          },
          true
        );
      })();
    </script>
